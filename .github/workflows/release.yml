name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - name: Configure Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF
      - run: flutter pub get
      - name: Build split APKs
        run: |
          mkdir -p release-apks
          flutter build apk --release --split-per-abi --target-platform=android-arm
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/
          flutter build apk --release --split-per-abi --target-platform=android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/
          flutter build apk --release --split-per-abi --target-platform=android-x64
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/
      - name: Upload release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.2 release-apks/*.apk --clobber
